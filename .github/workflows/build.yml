on: [push, pull_request]

jobs:
  test-neko:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [3.4.7, 4.0.5, 4.1.5, 4.2.5, 4.3.7, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.version }}
      - name: Haxelib setup
        run: |
          haxelib dev record-macros .
          haxelib install test-neko.hxml --always
      - name: Build
        run: haxe test-neko.hxml

  test-hl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [3.4.7, 4.0.5, 4.1.5, 4.2.5, 4.3.7, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.version }}
      - uses: HaxeFoundation/setup-hashlink@v1
      - name: Haxelib setup
        run: |
          haxelib dev record-macros .
          haxelib install test-hl.hxml --always
      - name: Build
        run: haxe test-hl.hxml

  test-php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [3.4.7, 4.0.5, 4.1.5, 4.2.5, 4.3.7, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.version }}
      - name: Haxelib setup
        run: |
          haxelib dev record-macros .
          haxelib install test-php.hxml --always
      - name: Build
        run: haxe test-php.hxml

  test-cpp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [3.4.7, 4.0.5, 4.1.5, 4.2.5, 4.3.7, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: HaxeFoundation/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.version }}
      - name: Haxelib setup
        run: |
          haxelib dev record-macros .
          haxelib install test-cpp.hxml --always
      - name: Build
        run: haxe test-cpp.hxml
